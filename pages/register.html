<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Sitio web de Encafeinados</title>
    <link rel="icon" type="image/png" href=".././images/logo-principal.png">
    <link rel="stylesheet" href=".././styles/register-styles.css">
</head>
<body>
    <!-------------------------------------------------------------------
        CABECERA Y NAVEGACION.
    -------------------------------------------------------------------->
    <header class="site-header">
        <nav class="main-nav">
            <div class="logo">
                <a href="../index.html">
                     <img src=".././images/logo-principal.png" alt="Logo de Encafeinados">
                </a>
            </div>
            <ul class="nav-list">
                <li><a href="">Boton 1</a></li>
                <li><a href="">Boton 2</a></li>
                <li><a href="./login.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>
    <!-------------------------------------------------------------------
        CONTENIDO PRINCIPAL.
    -------------------------------------------------------------------->
    <main class="main-content">
        <section class="register-container">
            <div class="register-card">  
                <header class="register-header">
                    <h1>Crea tu cuenta</h1>
                    <p>Por favor, completa los datos para registrarte en la plataforma.</p>
                </header>
                <form class="register-form" action="#" method="POST">
                    <div class="form-group">
                        <label for="fullname">Nombre completo</label>
                        <input type="text" id="fullname" name="fullname" autocomplete="name" required placeholder="Ejemplo: Juan Pérez">
                    </div>
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" autocomplete="email" required placeholder="Ejemplo: ejemplo@correo.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" autocomplete="new-password" required placeholder="****************">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirmar contraseña</label>
                        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required placeholder="****************">
                    </div>
                    <button type="submit" class="btn-submit">Registrarse</button>
                </form>
                <footer class="register-footer">
                    <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
                </footer>
            </div>
        </section>
    </main>
    <!-------------------------------------------------------------------
        PIE DE PAGINA.  
    -------------------------------------------------------------------->
    <footer class="site-footer">
        <div class="footer-top">
            <nav class="footer-nav">
                <ul class="footer-nav-list">
                    <li><a href="terminos.html">Términos y Condiciones</a></li>
                    <li><a href="privacidad.html">Política de Privacidad</a></li>
                    <li><a href="/servicios">Servicios</a></li>
                    <li><a href="/contacto">Contacto</a></li>
                </ul>
            </nav>
        </div>    
        <div class="footer-copyright">
            <p>&copy; 2026 enzo.dev -- Desarrollado con mucho cariño.</p>
        </div>
    </footer>
    <!-------------------------------------------------------------------
        CODIGO JAVASCRIPT
    -------------------------------------------------------------------->
    <script src=".././javascript/script.js"></script>

</body>
</html>
